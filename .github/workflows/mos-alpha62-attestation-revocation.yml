name: MOS Alpha-62 Attestation Revocation
on:
  push:
    branches: [mos-alpha62-attestation-revocation]
  workflow_dispatch:
jobs:
  attestation-revocation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha62_attestation_revocation.py
