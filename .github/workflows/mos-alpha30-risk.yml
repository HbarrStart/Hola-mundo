name: MOS Alpha-30 Risk
on:
  push:
    branches: [mos-alpha30-risk]
  workflow_dispatch:
jobs:
  risk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha30_risk.py
