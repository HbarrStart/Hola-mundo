name: MOS Alpha-52 Audit Export
on:
  push:
    branches: [mos-alpha52-audit-export]
  workflow_dispatch:
jobs:
  audit-export-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha52_audit_export.py
