name: MOS Alpha-45 Revocation
on:
  push:
    branches: [mos-alpha45-revocation]
  workflow_dispatch:
jobs:
  revocation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha45_revocation.py
