name: MOS Alpha-44 Key Rotation
on:
  push:
    branches: [mos-alpha44-key-rotation]
  workflow_dispatch:
jobs:
  key-rotation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha44_key_rotation.py
