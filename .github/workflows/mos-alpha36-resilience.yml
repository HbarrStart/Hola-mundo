name: MOS Alpha-36 Resilience
on:
  push:
    branches: [mos-alpha36-resilience]
  workflow_dispatch:
jobs:
  resilience-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha36_resilience.py
