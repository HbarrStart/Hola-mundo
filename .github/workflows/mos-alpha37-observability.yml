name: MOS Alpha-37 Observability
on:
  push:
    branches: [mos-alpha37-observability]
  workflow_dispatch:
jobs:
  observability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha37_observability.py
