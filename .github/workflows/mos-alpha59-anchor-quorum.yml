name: MOS Alpha-59 Anchor Quorum
on:
  push:
    branches: [mos-alpha59-anchor-quorum]
  workflow_dispatch:
jobs:
  anchor-quorum-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha59_anchor_quorum.py
