name: MOS Alpha-48 Replay Window
on:
  push:
    branches: [mos-alpha48-replay-window]
  workflow_dispatch:
jobs:
  replay-window-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha48_replay_window.py
