name: MOS Alpha-32 Human Oversight
on:
  push:
    branches: [mos-alpha32-human-oversight]
  workflow_dispatch:
jobs:
  oversight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha32_human_oversight.py
