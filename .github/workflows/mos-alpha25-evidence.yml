name: MOS Alpha-25 Evidence Ledger
on:
  push:
    branches: [mos-alpha25-evidence-ledger, mos-alpha25-evidence-ledger-ci]
  pull_request:
    branches: [mos-alpha25-evidence-ledger]
  workflow_dispatch:
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha25_evidence_ledger.py
