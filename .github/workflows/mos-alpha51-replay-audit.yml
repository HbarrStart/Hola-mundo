name: MOS Alpha-51 Replay Audit
on:
  push:
    branches: [mos-alpha51-replay-audit]
  workflow_dispatch:
jobs:
  replay-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha51_replay_audit.py
