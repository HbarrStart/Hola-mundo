name: MOS ingestion monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run MOS ingestion
        run: python scripts/mos_ingest.py

      - name: Commit ingestion report
        run: |
          git config user.name "MOS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingestion_report.json
          git diff --cached --quiet || git commit -m "chore(mos): update source ingestion report"
          git push
