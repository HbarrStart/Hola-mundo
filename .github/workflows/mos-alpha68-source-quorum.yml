name: MOS Alpha-68 Source Quorum
on:
  push:
    branches: [mos-alpha68-source-quorum]
  workflow_dispatch:
jobs:
  source-quorum-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha68_source_quorum.py
