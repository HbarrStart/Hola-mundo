name: MOS Alpha-28 Temporality
on:
  push:
    branches: [mos-alpha28-temporality]
  workflow_dispatch:
jobs:
  temporality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha28_temporality.py
