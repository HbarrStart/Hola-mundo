name: MOS Alpha-69 Source Consistency
on:
  push:
    branches: [mos-alpha69-source-consistency]
  workflow_dispatch:
jobs:
  consistency-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q scripts/mos_alpha69_source_consistency.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha69_source_consistency.py
