name: MOS Alpha-43 Signed Events
on:
  push:
    branches: [mos-alpha43-signed-events]
  workflow_dispatch:
jobs:
  signed-events-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha43_signed_events.py
