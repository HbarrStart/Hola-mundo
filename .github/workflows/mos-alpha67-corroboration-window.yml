name: MOS Alpha-67 Corroboration Window
on:
  push:
    branches: [mos-alpha67-corroboration-window]
  workflow_dispatch:
jobs:
  corroboration-window-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha67_corroboration_window.py
