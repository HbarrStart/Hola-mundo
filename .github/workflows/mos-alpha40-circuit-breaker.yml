name: MOS Alpha-40 Circuit Breaker
on:
  push:
    branches: [mos-alpha40-circuit-breaker]
  workflow_dispatch:
jobs:
  circuit-breaker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha40_circuit_breaker.py
