name: MOS Alpha-47 Envelope Replay
on:
  push:
    branches: [mos-alpha47-envelope-replay]
  workflow_dispatch:
jobs:
  envelope-replay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha47_envelope_replay.py
