name: MOS safety gate

on:
  push:
    branches: [mos-v0-emergencia]
  pull_request:
    branches: [mos-v0-emergencia]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run safety tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q
      - name: Run fail-closed gate
        run: python scripts/mos_safety_gate.py
