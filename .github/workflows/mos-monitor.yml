name: MOS emergency monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor
        run: python scripts/mos_monitor.py
      - name: Commit generated data when changed
        run: |
          git config user.name 'MOS Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'MOS: update monitored source snapshot'
          git push
