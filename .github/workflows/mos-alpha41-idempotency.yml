name: MOS Alpha-41 Idempotency
on:
  push:
    branches: [mos-alpha41-idempotency]
  workflow_dispatch:
jobs:
  idempotency-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha41_idempotency.py
