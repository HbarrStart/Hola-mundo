name: MOS Alpha-50 Replay Metrics
on:
  push:
    branches: [mos-alpha50-replay-metrics]
  workflow_dispatch:
jobs:
  replay-metrics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha50_replay_metrics.py
