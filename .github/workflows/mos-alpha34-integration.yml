name: MOS Alpha-34 Integration
on:
  push:
    branches: [mos-alpha34-integration]
  workflow_dispatch:
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=scripts python -m pytest -q tests/test_mos_alpha34_integration.py
