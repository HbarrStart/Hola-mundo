name: MOS Alpha-26 Traceability
on:
  push:
    branches: [mos-alpha26-traceable-claim, mos-alpha26-traceable-claim-ci]
  pull_request:
    branches: [mos-alpha26-traceable-claim]
  workflow_dispatch:
jobs:
  traceability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha26_traceable_claim.py
