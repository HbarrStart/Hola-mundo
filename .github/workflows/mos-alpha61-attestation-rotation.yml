name: MOS Alpha-61 Attestation Rotation
on:
  push:
    branches: [mos-alpha61-attestation-rotation]
  workflow_dispatch:
jobs:
  attestation-rotation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha61_attestation_rotation.py
