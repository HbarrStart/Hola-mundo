name: MOS Alpha-70 Official Ingest
on:
  push:
    branches: [mos-alpha70-official-ingest]
  workflow_dispatch:
jobs:
  official-ingest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q scripts/mos_alpha70_official_ingest.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha70_official_ingest.py
