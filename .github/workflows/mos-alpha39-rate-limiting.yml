name: MOS Alpha-39 Rate Limiting
on:
  push:
    branches: [mos-alpha39-rate-limit-final]
  workflow_dispatch:
jobs:
  rate-limit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha39_rate_limiting.py
