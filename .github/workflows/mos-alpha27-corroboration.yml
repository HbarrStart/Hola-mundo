name: MOS Alpha-27 Corroboration
on:
  push:
    branches: [mos-alpha27-corroboration]
  workflow_dispatch:
jobs:
  corroboration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha27_corroboration.py
