name: MOS Alpha-65 Evidence State
on:
  push:
    branches: [mos-alpha65-evidence-state]
  workflow_dispatch:
jobs:
  evidence-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha65_evidence_state.py
