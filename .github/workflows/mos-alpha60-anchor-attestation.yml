name: MOS Alpha-60 Anchor Attestation
on:
  push:
    branches: [mos-alpha60-anchor-attestation]
  workflow_dispatch:
jobs:
  anchor-attestation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha60_anchor_attestation.py
