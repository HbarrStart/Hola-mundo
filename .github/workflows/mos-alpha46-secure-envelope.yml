name: MOS Alpha-46 Secure Envelope
on:
  push:
    branches: [mos-alpha46-secure-envelope]
  workflow_dispatch:
jobs:
  secure-envelope-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha46_secure_envelope.py
