name: MOS Alpha-63 Revocation Enforcement
on:
  push:
    branches: [mos-alpha63-revocation-enforcement]
  workflow_dispatch:
jobs:
  revocation-enforcement-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha63_revocation_enforcement.py
