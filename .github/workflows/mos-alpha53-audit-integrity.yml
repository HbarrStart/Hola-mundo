name: MOS Alpha-53 Audit Integrity
on:
  push:
    branches: [mos-alpha53-audit-integrity]
  workflow_dispatch:
jobs:
  audit-integrity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha53_audit_integrity.py
