name: MOS Alpha-38 Alert Deduplication
on:
  push:
    branches: [mos-alpha38-alert-dedupe-build]
  workflow_dispatch:
jobs:
  dedupe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha38_alert_deduplication.py
