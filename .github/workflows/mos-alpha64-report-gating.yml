name: MOS Alpha-64 Report Gating
on:
  push:
    branches: [mos-alpha64-report-gating]
  workflow_dispatch:
jobs:
  report-gating-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha64_report_gating.py
