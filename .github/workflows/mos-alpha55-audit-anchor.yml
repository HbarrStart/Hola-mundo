name: MOS Alpha-55 Audit Anchor
on:
  push:
    branches: [mos-alpha55-audit-anchor]
  workflow_dispatch:
jobs:
  audit-anchor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha55_audit_anchor.py
