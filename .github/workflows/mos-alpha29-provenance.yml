name: MOS Alpha-29 Provenance
on:
  push:
    branches: [mos-alpha29-provenance]
  workflow_dispatch:
jobs:
  provenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_mos_alpha29_provenance.py
