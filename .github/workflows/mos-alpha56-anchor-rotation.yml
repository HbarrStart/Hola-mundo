name: MOS Alpha-56 Anchor Rotation
on:
  push:
    branches: [mos-alpha56-anchor-rotation]
  workflow_dispatch:
jobs:
  anchor-rotation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha56_anchor_rotation.py
