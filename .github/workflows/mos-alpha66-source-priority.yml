name: MOS Alpha-66 Source Priority
on:
  push:
    branches: [mos-alpha66-source-priority]
  workflow_dispatch:
jobs:
  source-priority-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha66_source_priority.py
