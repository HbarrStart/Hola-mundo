name: MOS Alpha-35 Action Safety
on:
  push:
    branches: [mos-alpha35-action-safety]
  workflow_dispatch:
jobs:
  action-safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_mos_alpha35_action_safety.py
